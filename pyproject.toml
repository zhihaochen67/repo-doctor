[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-doctor"
version = "0.3.0"
description = "A safe repository health checker with optional AI-assisted repair"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "rich>=13.7", "httpx>=0.27", "mcp>=2.0.0"]

[project.scripts]
repo-doctor = "repo_doctor.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
norecursedirs = ["tests/fixtures"]
markers = ["integration: opt-in tests using an external ToolHub process"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
